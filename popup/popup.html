<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clippy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1 class="title">Clippy</h1>
        <p class="subtitle">Clippe un passage YouTube en un geste</p>
      </header>

      <section class="section">
        <label class="label" for="clip-duration">Durée du clip</label>
        <p class="hint">Exemple : <code>1:30</code> pour 1 min 30</p>
        <input
          id="clip-duration"
          class="input"
          type="text"
          inputmode="numeric"
          placeholder="1:30"
          autocomplete="off"
          spellcheck="false"
        />
        <p id="duration-error" class="error" hidden>Format invalide (mm:ss ou h:mm:ss)</p>
      </section>

      <section class="section">
        <label class="label" for="shortcut">Raccourci clavier</label>
        <p class="hint">Clique puis appuie sur la combinaison souhaitée</p>
        <button id="shortcut" class="input shortcut-btn" type="button">
          <span id="shortcut-label">shift+c</span>
        </button>
        <p id="shortcut-error" class="error" hidden>Raccourci invalide</p>
        <p class="hint subtle">
          Tu peux aussi configurer
          <a id="commands-link" href="#">le raccourci global Chrome</a>
        </p>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>
    <script src="../lib/time.js"></script>
    <script src="../lib/shortcut.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
